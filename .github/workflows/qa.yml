name: QA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    name: Graph, runtime and accessibility checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: qa
        run: npm install --no-audit --no-fund

      - name: Run QA suite
        working-directory: qa
        run: node qa.js ..
