services:
  - type: web
    runtime: static
    name: pocket-dragons-choosing
    buildCommand: ""
    staticPublishPath: .
    headers:
      # Hashed-content assets never change in place; cache them hard.
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The document itself must revalidate so deploys take effect immediately.
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
